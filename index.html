<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboDLmp4 - Universal Video Downloader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #06020f; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { width: 100%; max-width: 410px; background: rgba(20, 14, 40, 0.85); padding: 35px 26px; border-radius: 28px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7); border: 1px solid rgba(16, 185, 129, 0.3); text-align: center; }
        .logo-box { background: linear-gradient(135deg, #059669 0%, #7c3aed 100%); color: #ffffff; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; border-radius: 22px; margin: 0 auto 18px auto; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
        h1 { font-size: 34px; font-weight: 950; background: linear-gradient(90deg, #10b981, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 6px 0; }
        .subtitle { font-size: 12px; color: #a1a1aa; margin: 0 0 32px 0; text-transform: uppercase; letter-spacing: 1.5px; }
        .input-group { display: flex; flex-direction: column; gap: 16px; }
        input[type="text"] { width: 100%; padding: 18px; background: rgba(10, 5, 25, 0.9); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 16px; color: #ffffff; font-size: 15px; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 18px; background: linear-gradient(90deg, #10b981, #8b5cf6); color: #ffffff; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        #loader { display: none; margin: 26px 0; }
        .loader-text { color: #c084fc; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
        .loader-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative; }
        .loader-bar-fill { width: 40%; height: 100%; background: linear-gradient(90deg, #10b981, #8b5cf6); position: absolute; border-radius: 10px; animation: movePatti 1.5s infinite ease-in-out; }
        @keyframes movePatti { 0% { left: -40%; } 100% { left: 100%; } }
        #result { display: none; margin-top: 32px; text-align: left; }
        #videoTitle { font-size: 14px; font-weight: 700; color: #f4f4f5; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .links-list { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; align-items: center; justify-content: space-between; background: rgba(10, 5, 25, 0.6); padding: 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .quality-txt { font-weight: 900; color: #10b981; font-size: 16px; }
        .size-txt { font-size: 12px; color: #a1a1aa; }
        .dl-btn { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); color: #ffffff; font-size: 13px; font-weight: 800; padding: 10px 18px; text-decoration: none; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="logo-box">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width:32px;height:32px;margin-top:16px;"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" /></svg>
            </div>
            <h1>TurboDLmp4</h1>
            <p class="subtitle">Universal Video Converter</p>
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Paste video link here..."><button onclick="fetchLinks()">Extract Media</button>
            </div>
            <div id="loader">
                <div class="loader-text">✨ MANIFESTING DOWNLOAD LINKS...</div>
                <div class="loader-bar-bg"><div class="loader-bar-fill"></div></div>
            </div>
            <div id="result"><h3 id="videoTitle">🎬 Video Title</h3><div id="linksList" class="links-list"></div></div>
        </div>
    </div>
    <script>
        function fetchLinks() {
            const url = document.getElementById('videoUrl').value;
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');
            const linksList = document.getElementById('linksList');
            if(!url) { alert('Please paste a link first!'); return; }
            
            loader.style.display = 'block'; result.style.display = 'none'; linksList.innerHTML = '';
            
            fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            })
            .then(res => res.json())
            .then(data => {
                loader.style.display = 'none';
                if(data.success) {
                    document.getElementById('videoTitle').innerText = "🎬 " + data.title;
                    data.formats.forEach(f => {
                        const row = document.createElement('div'); row.className = "row";
                        row.innerHTML = `<div><span class="quality-txt">${f.quality}</span><span class="size-txt block">${f.size}</span></div><a href="${f.url}" target="_blank" class="dl-btn">Download</a>`;
                        linksList.appendChild(row);
                    });
                    result.style.display = 'block';
                } else { alert('Error: ' + data.message); }
            })
            .catch(() => { loader.style.display = 'none'; alert('Server is waking up. Please tap Extract again in 5 seconds!'); });
        }
    </script>
</body>
                               </html>
